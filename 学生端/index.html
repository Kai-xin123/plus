<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作业</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#f4f7fa;color:#222;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px}
.card{max-width:760px;width:100%;background:#fff;border-radius:16px;box-shadow:0 4px 16px #00000018;padding:36px}
h1{font-size:26px;margin-bottom:18px;color:#0ea5e9;border-bottom:2px solid #eef2f7;padding-bottom:12px}
.homeworkText{font-size:20px;line-height:1.9;white-space:pre-wrap;min-height:60px}
.homeworkText a{color:#2563eb;text-decoration:underline;cursor:pointer;word-break:break-all}
.empty{color:#999;font-size:18px}
.codeBox{margin-top:20px;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.codeBar{display:flex;align-items:center;justify-content:space-between;background:#334155;color:#fff;padding:10px 14px;cursor:pointer;user-select:none}
.codeBar .left{display:flex;align-items:center;gap:8px;font-weight:600}
.codeBar .btns{display:flex;gap:8px}
.codeBar button{background:#475569;color:#fff;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;min-width:52px;display:flex;align-items:center;justify-content:center}
.codeBar button:hover{background:#64748b}
.codeBody{display:none;background:#0f172a;color:#e2e8f0;padding:16px;overflow:auto;max-height:420px}
.codeBox.open .codeBody{display:block}
.codeBody pre{font-family:Consolas,Monaco,monospace;font-size:14px;line-height:1.6;white-space:pre}
.time{margin-top:20px;font-size:13px;color:#999;text-align:right}
#copyToast{position:fixed;left:50%;top:32%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 22px;border-radius:10px;font-size:15px;opacity:0;transition:opacity 0.25s ease;pointer-events:none;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,0.3)}
#copyToast.show{opacity:1}
</style>
</head>
<body>
<div class="card">
  <h1>作业</h1>
  <div class="homeworkText" id="homeworkText">加载中…</div>

  <div class="codeBox" id="codeBox" style="display:none">
    <div class="codeBar" onclick="toggleCode()">
      <span class="left">&lt;/&gt; 代码 <span id="codeArrow">▼</span></span>
      <span class="btns">
        <button onclick="event.stopPropagation();copyCode(this)">复制</button>
      </span>
    </div>
    <div class="codeBody"><pre id="codePre"></pre></div>
  </div>

  <div class="time" id="time"></div>
</div>
<div id="copyToast">代码已复制！</div>
<script>
let currentCode = "";
let toastTimer = null;
function showCopyToast(){
  const t = document.getElementById("copyToast");
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 1500);
}
function toggleCode(){
  const box = document.getElementById("codeBox");
  box.classList.toggle("open");
  document.getElementById("codeArrow").textContent = box.classList.contains("open") ? "▲" : "▼";
}
async function copyCode(btn){
  try{
    await navigator.clipboard.writeText(currentCode);
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = currentCode; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  btn.textContent = "✓";
  showCopyToast();
  setTimeout(()=>{ btn.textContent = "复制"; }, 1500);
}
function linkify(text){
  const esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  return esc.replace(/(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+|\b(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+(?:com|cn|net|org|io|top|xyz|edu|gov|me|co|cc|biz)(?:[\/?#][^\s<>"']*)?)/gi, (m)=>{
    let url = m;
    if(!/^https?:\/\//i.test(url)) url = "https://" + url;
    return '<a href="' + url.replace(/&/g,"&amp;").replace(/"/g,"&quot;") + '" target="_blank" rel="noopener noreferrer">' + m + '</a>';
  });
}
async function loadHomework(){
  const el = document.getElementById("homeworkText");
  try{
    const r = await fetch("/api/homework");
    if(!r.ok){
      el.textContent = "接口错误：/api/homework 返回 " + r.status + "（Functions 未生效或KV异常）";
      el.classList.add("empty");
      return;
    }
    const d = await r.json();
    if(d.text && d.text.trim()){
      el.innerHTML = linkify(d.text); el.classList.remove("empty");
    }else{
      el.textContent = "暂无作业"; el.classList.add("empty");
    }
    const box = document.getElementById("codeBox");
    if(d.code && d.code.trim()){
      currentCode = d.code;
      box.style.display = "block";
      document.getElementById("codePre").textContent = d.code;
    }else{
      box.style.display = "none";
    }
  }catch(e){
    el.textContent = "接口未生效：无法连接 /api/homework（404，Functions 未上传）";
    el.classList.add("empty");
  }
  document.getElementById("time").textContent = "更新于 " + new Date().toLocaleTimeString();
}
loadHomework();
setInterval(loadHomework, 1000);
</script>
</body>
</html>
